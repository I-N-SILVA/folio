name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time public env vars. Real secrets come from repo/Environment
          # secrets; these placeholders just let the build resolve.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://qlico.app

  # The consolidated migration is what an operator pastes into the Supabase SQL
  # editor to set production up, and until this job existed it had never been
  # executed anywhere. It is generated by concatenation with regex-added
  # idempotency guards; a syntax error in it surfaces on launch night.
  #
  # This applies it to a real Postgres, applies it a second time to prove it is
  # re-runnable, then saves pages through `replace_book_pages` and writes one of
  # every event type — so a CHECK constraint drifting behind the app fails here
  # instead of silently dropping every heatmap in production. Both constraint
  # bugs in this repo's history would have failed this job.
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install the postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply and exercise the consolidated migration
        run: bash scripts/verify-migration.sh
